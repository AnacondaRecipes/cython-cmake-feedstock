{% set name = "cython-cmake" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1f6091f8003daf121592601eecddb4c318189232d2d35adf968aa609653a0b4e

build:
  number: 0
  noarch: python
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - cython-cmake = cython_cmake.__main__:main

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - cython

test:
  requires:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pip
    - pytest
    - scikit-build-core
    - ninja
    - cmake >=3.21
    - make  # [not win]
  source_files:
    - tests
    - src
    - pyproject.toml
  imports:
    - cython_cmake
  commands:
    - pip check
    - pytest tests -vv --durations=20

about:
  home: https://github.com/scikit-build/cython-cmake
  summary: CMake helpers for building Cython modules
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  description: |
    cython-cmake provides CMake helpers (FindCython and UseCython) for
    building Cython extension modules, exposed as a CMake package via
    the cmake.module entry point for use by scikit-build-core and other
    CMake-based build backends.
  dev_url: https://github.com/scikit-build/cython-cmake
  doc_url: https://github.com/scikit-build/cython-cmake

extra:
  recipe-maintainers:
    - conda-forge/scikit-build
  skip-lints:
    - cython_needs_compiler
    - python_build_tools_in_host
